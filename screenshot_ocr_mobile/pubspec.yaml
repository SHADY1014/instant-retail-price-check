name: price_check_ocr
description: 美团截图OCR自动填表系统 - 移动端
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # OCR - Google ML Kit 文字识别（离线中文）
  google_mlkit_text_recognition: ^0.14.0

  # 图片选择
  image_picker: ^1.0.0
  photo_manager: ^3.0.0

  # 数据库
  sqflite: ^2.3.0
  path: ^1.8.0

  # Excel 生成
  excel: ^4.0.0

  # 文件路径 + 分享
  path_provider: ^2.1.0
  share_plus: ^10.0.0

  # 网络（百度地图城市识别）
  http: ^1.2.0

  # Excel 图片嵌入（zip 重打包 + 图片缩放编码）
  archive: ^3.6.0
  image: ^4.2.0

  # UI
  cupertino_icons: ^1.0.0
  provider: ^6.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/shop_city.db
    - assets/模板.xlsx

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
